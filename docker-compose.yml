name: consume

services:
  api:
    container_name: consume-api
    image: ghcr.io/abhi11verma/consume:latest
    ports:
      - target: 3000
        published: "${WEBUI_PORT:-3000}"
        protocol: tcp
    environment:
      DATABASE_URL: postgres://consume:consume@consume-db:5432/consume
      JWT_SECRET: ${JWT_SECRET:-changeme_replace_before_first_run}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.home}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      NODE_ENV: production
      IMAGES_DIR: /data/images
    volumes:
      - type: bind
        source: ./data/images
        target: /data/images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - consume_network
    x-casaos:
      envs:
        - container: JWT_SECRET
          description:
            en_US: Random secret for signing JWT tokens — change before first run
        - container: ADMIN_EMAIL
          description:
            en_US: Email address for the initial admin account
        - container: ADMIN_PASSWORD
          description:
            en_US: Password for the initial admin account — change before first run
      ports:
        - container: "3000"
          description:
            en_US: Web UI
      volumes:
        - container: /data/images
          description:
            en_US: Uploaded thumbnail images

  db:
    container_name: consume-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consume
      POSTGRES_PASSWORD: consume
      POSTGRES_DB: consume
    volumes:
      - type: bind
        source: ./data/pgdata
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consume"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - consume_network

networks:
  consume_network:
    driver: bridge

x-casaos:
  id: io.github.consume
  architectures:
    - amd64
    - arm64
  main: api
  title:
    en_US: Consume
  tagline:
    en_US: Your personal digital library
  description:
    en_US: |
      Capture and organize links — videos, books, articles, podcasts, and news.
      Self-hosted, private, and fast. Multi-user with admin controls.
  category: Productivity
  port_map: "${WEBUI_PORT:-3000}"
  version: "1.0.0"
  tips:
    before_install:
      en_US: |
        Set JWT_SECRET to a random string before installing.
        Set ADMIN_EMAIL and ADMIN_PASSWORD to your desired admin credentials.
        These are only used to create the first admin account if none exists.
